[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The engine lives at the repository root, not in an installed package, so the
# root has to be importable for `import diagnose` to resolve. Without this, a
# fresh clone fails collection (`ModuleNotFoundError: diagnose`) because pytest
# only puts the test file's own directory on sys.path.
pythonpath = ["."]
